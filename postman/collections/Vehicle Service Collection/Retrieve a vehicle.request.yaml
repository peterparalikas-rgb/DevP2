$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  id: "1"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const status = pm.response.code;
      const json = pm.response.json();

      // ── 200 Success ──────────────────────────────────────────────────────────
      if (status === 200) {
        pm.test("200: Status code is 200", () => {
          pm.response.to.have.status(200);
        });

        pm.test("200: Content-Type is application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        pm.test("200: Response body is an object", () => {
          pm.expect(json).to.be.an("object");
        });

        pm.test("200: 'id' is a number", () => {
          pm.expect(json).to.have.property("id").that.is.a("number");
        });

        pm.test("200: 'nickName' is a string", () => {
          pm.expect(json).to.have.property("nickName").that.is.a("string");
        });

        pm.test("200: 'vin' is a string", () => {
          pm.expect(json).to.have.property("vin").that.is.a("string");
        });

        pm.test("200: 'make' is a string", () => {
          pm.expect(json).to.have.property("make").that.is.a("string");
        });

        pm.test("200: 'model' is a string", () => {
          pm.expect(json).to.have.property("model").that.is.a("string");
        });

        pm.test("200: 'year' is a string", () => {
          pm.expect(json).to.have.property("year").that.is.a("string");
        });

        pm.test("200: 'miles' is a number", () => {
          pm.expect(json).to.have.property("miles").that.is.a("number");
        });

        pm.test("200: No unexpected fields in response", () => {
          const allowedKeys = ["id", "nickName", "vin", "make", "model", "year", "miles"];
          const extraKeys = Object.keys(json).filter(k => !allowedKeys.includes(k));
          pm.expect(extraKeys, "Unexpected fields: " + extraKeys.join(", ")).to.be.empty;
        });
      }

      // ── 404 Not Found ─────────────────────────────────────────────────────────
      if (status === 404) {
        pm.test("404: Status code is 404", () => {
          pm.response.to.have.status(404);
        });

        pm.test("404: Content-Type is application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        pm.test("404: Response body is an object", () => {
          pm.expect(json).to.be.an("object");
        });

        pm.test("404: 'message' is a string", () => {
          pm.expect(json).to.have.property("message").that.is.a("string");
        });

        pm.test("404: 'message' references the missing vehicle id", () => {
          const id = pm.request.url.variables.get("id");
          pm.expect(json.message).to.include(id);
        });
      }

      // ── 500 Unexpected Error ──────────────────────────────────────────────────
      if (status === 500) {
        pm.test("500: Status code is 500", () => {
          pm.response.to.have.status(500);
        });

        pm.test("500: Content-Type is application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        pm.test("500: Response body is an object", () => {
          pm.expect(json).to.be.an("object");
        });

        pm.test("500: 'message' is a string", () => {
          pm.expect(json).to.have.property("message").that.is.a("string");
        });
      }

      // ── All responses ─────────────────────────────────────────────────────────
      pm.test("Response time is under 2000ms", () => {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Status code is one of the documented values (200, 404, 500)", () => {
        pm.expect([200, 404, 500]).to.include(status);
      });
settings: {}
examples: ./.resources/Retrieve a vehicle.resources/examples
order: 2000
