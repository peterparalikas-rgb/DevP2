$kind: http-request
url: "{{baseUrl}}/vehicles"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nickName": "The Lisa Marie",
      "vin": "4M2DV11W4RDJ53329",
      "make": "Mercury",
      "model": "Villager",
      "year": "1994",
      "miles": 159864
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("VIN is a string", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.vin).to.be.a.string;
      });
    language: text/javascript
settings: {}
examples: ./.resources/Create a vehicle.resources/examples
order: 1000
