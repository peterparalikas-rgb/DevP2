openapi: 3.0.0
info:
  title: Vehicle Service Collection
  version: 1.0.0
  description: >-
    # Vehicle Service API — Getting Started Guide


    ## Overview & Purpose

    The **Vehicle Service API** is a RESTful service for managing a fleet of
    vehicle records. It lets you create, retrieve, update, and delete vehicles,
    each described by attributes such as a nickname, VIN, make, model, year, and
    mileage. The API is intentionally simple and resource-oriented, exposing a
    single `vehicles` resource that follows standard HTTP semantics
    (GET/POST/PATCH/DELETE), making it easy to integrate into inventory,
    dealership, maintenance, or telematics systems.


    The intent of this API is to serve as the **single source of truth for
    vehicle records** — a lightweight backing service that other applications
    call to persist and read vehicle data without needing to know the underlying
    storage details.


    ### Typical End Users

    - **Backend/Integration developers** building fleet, dealership, or
    inventory applications that need to persist vehicle data.

    - **QA & Test engineers** validating vehicle workflows against mock or
    staging environments.

    - **Frontend developers** who need a reliable contract (via the mock server)
    to build UIs before the backend is ready.

    - **Automation / DevOps engineers** running the collection in monitors or CI
    pipelines to check service health.


    ### Common Use Cases

    - Registering a new vehicle in a fleet or inventory system (**Create a
    vehicle**).

    - Listing the full fleet for dashboards or reports (**Get all vehicles**).

    - Looking up a single vehicle's details by ID (**Retrieve a vehicle**).

    - Updating mutable attributes such as mileage or nickname (**Update a
    collection / vehicle**).

    - Retiring or removing a vehicle from the fleet (**Delete a vehicle**).

    - Front-end prototyping and contract testing against the Postman mock
    server.


    ---


    ## 1. Authenticating API Requests (Step by Step)

    This collection uses an **API key** that is stored securely in the Postman
    Vault and referenced as `{{vault:apiKey}}`.


    1. Open the **Vehicle Service Collection** in the sidebar and click its name
    to open collection settings.

    2. Go to the **Authorization** tab for the collection.

    3. Choose an auth type that matches the service — for an API key, select
    **API Key** (or **Bearer Token** if the service expects a bearer header).

    4. In the **Value** field, reference the vaulted secret instead of pasting
    the raw key: `{{vault:apiKey}}`.
       - For API Key auth: set **Key** to the header name the service expects (for example `X-API-Key`), **Value** to `{{vault:apiKey}}`, and **Add to** = `Header`.
       - For Bearer auth: set **Token** to `{{vault:apiKey}}`.
    5. Leave each individual request's Authorization set to **Inherit auth from
    parent** so every request automatically uses the collection-level
    credential. This means you configure the key in exactly one place.

    6. Send any request (for example **Get all vehicles**). A `200` response
    confirms authentication is working; a `401`/`403` means the key is missing
    or invalid (see the Error Handling section).


    > Tip: Never hardcode the raw API key into a request, header, or environment
    value that is synced. Always reference `{{vault:apiKey}}` so the secret
    stays local and private.


    ---


    ## 2. Managing Multiple Environments

    Environments let you point the same requests at different servers (mock,
    staging, production) by swapping variable values instead of editing each
    request.


    **Key variable:** `baseUrl` — the root URL of the API. Every request is
    built as `{{baseUrl}}/vehicles`.


    Step by step:

    1. In the left sidebar, open the **Environments** tab.

    2. The workspace ships with a **Mock Environment** where `baseUrl` points to
    the Postman mock server
    (`https://086a6e23-004a-4429-b4ee-8889b49190ef.mock.pstmn.io`).

    3. To add another environment (e.g. Staging or Production), click **+** to
    create a new environment, add a variable named `baseUrl`, and set its
    **Current Value** to that environment's host (for example
    `https://staging.api.vehicle-service.com`).

    4. Use the **environment selector** (top-right of the app) to switch the
    active environment. All requests using `{{baseUrl}}` instantly target the
    selected environment — no request edits needed.

    5. Keep secrets (like the API key) out of environments — use the Vault
    instead (see next section). Use environments only for non-secret,
    environment-specific config such as URLs.


    > Best practice: Use the **Current Value** (local, not synced) for anything
    sensitive or machine-specific, and the **Initial Value** (synced to the
    team) only for safe, shareable defaults.


    ---


    ## 3. Securely Storing API Keys in the Vault

    The **Postman Vault** stores secrets locally on your machine; vault values
    are never synced to Postman's servers or shared with your team.


    Step by step:

    1. At the bottom-left of the Postman app, click the **Vault** icon.

    2. Unlock the Vault (set a Vault key / password the first time if prompted).

    3. Click **Add secret**. Set the **Name** to `apiKey` and paste your real
    API key as the **Value**. Save.

    4. Reference it anywhere in the collection — in auth, headers, or body —
    using the syntax `{{vault:apiKey}}`.

    5. Because the collection authorization already uses `{{vault:apiKey}}`,
    every inheriting request is now authenticated with your private key with
    nothing sensitive stored in the collection or environment.


    > Why this matters: Vault secrets never leave your device. This prevents
    accidental leakage of credentials through synced collections, environments,
    or shared workspaces.


    ---


    ## 4. Handling Common Errors (by Status Code)

    Each request in this collection includes saved **examples** that show the
    exact response shape for both success and error cases. Use this table to
    diagnose and respond to failures.


    | Status | Meaning | Likely Cause | How to Handle |

    |--------|---------|--------------|---------------|

    | **200 OK** | Success | Request succeeded (GET/PATCH) | Parse and use the
    returned vehicle data. |

    | **201 Created** | Resource created | A vehicle was successfully created
    (POST) | Store the returned `id` for later retrieval/updates. |

    | **204 No Content** | Success, no body | Vehicle successfully deleted
    (DELETE) | No body is returned — treat as success. |

    | **400 Bad Request** | Invalid input | Missing required attribute or
    malformed JSON body | Check the request body against the required schema
    (e.g. `vin`, `make`, `model`). Fix the field named in the error and resend.
    |

    | **401 / 403 Unauthorized / Forbidden** | Auth failure | Missing, invalid,
    or expired API key | Verify `{{vault:apiKey}}` is set in the Vault and the
    collection Authorization is configured correctly. |

    | **404 Not Found** | Resource missing | The `:id` path parameter does not
    match any vehicle | Confirm the `id` exists (run **Get all vehicles** first)
    and that `baseUrl` points to the right environment. |

    | **409 Conflict** | Duplicate resource | Creating a vehicle that already
    exists (e.g. duplicate VIN) | Retrieve the existing vehicle instead of
    recreating it, or change the conflicting unique field. |

    | **500 Internal Server Error** | Unexpected server error | A fault on the
    server side | Retry with backoff; if it persists, the issue is server-side —
    check service health and report it. |


    > Tip: Open the matching example (e.g. **400 - Missing required attribute**,
    **404 - Not found**, **409 - Vehicle already exists**) under each request to
    see the precise error payload before writing client-side handling.


    ---


    ## 5. Parameter Types & Contextual Information

    This API uses three categories of parameters.


    ### Path Parameters

    - `:id` — Used in **Retrieve**, **Update**, and **Delete** requests as
    `{{baseUrl}}/vehicles/:id`. This is the unique identifier of the vehicle.
    Set its value in the request's **Path Variables** section. Required for any
    single-vehicle operation.


    ### Variables

    - `baseUrl` *(string, required)* — The API host. Resolved from the active
    environment or collection. Example: a mock host or a staging/production URL.

    - `vault:apiKey` *(secret, required)* — The API credential, pulled from the
    Vault.


    ### Request Body (JSON) — for Create and Update

    Sent with `Content-Type: application/json`. Fields for a vehicle:


    | Field | Type | Description | Example |

    |-------|------|-------------|---------|

    | `nickName` | string | Friendly name for the vehicle | `"The Lisa Marie"` |

    | `vin` | string | Vehicle Identification Number (unique) |
    `"4M2DV11W4RDJ53329"` |

    | `make` | string | Manufacturer | `"Mercury"` |

    | `model` | string | Model name | `"Villager"` |

    | `year` | string | Model year | `"1994"` |

    | `miles` | number | Odometer reading | `159864` |


    ### Headers

    - `Content-Type: application/json` — required on requests that send a body
    (Create, Update).

    - `Accept: application/json` — tells the server to return JSON.


    ---


    ## Quick Start Checklist

    1. Add your API key to the Vault as `apiKey`.

    2. Confirm the collection Authorization references `{{vault:apiKey}}`.

    3. Select the **Mock Environment** (or your own) so `baseUrl` resolves.

    4. Send **Get all vehicles** — a `200` confirms you're set up correctly.

    5. Try **Create a vehicle**, then **Retrieve**, **Update**, and **Delete**
    using the returned `id`.
servers:
  - url: '{{baseUrl}}'
paths:
  /vehicles:
    get:
      summary: Get all vehicles
      responses:
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nickName:
                      type: string
                    vin:
                      type: string
                    make:
                      type: string
                    model:
                      type: string
                    year:
                      type: string
                      format: utc-millisec
                    miles:
                      type: integer
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
    post:
      summary: Create a vehicle
      responses:
        '201':
          description: 201 - Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nickName:
                    type: string
                  vin:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  year:
                    type: string
                  miles:
                    type: string
              example:
                id: 1
                nickName: The Lisa Marie
                vin: 4M2DV11W4RDJ53329
                make: Mercury
                model: Villager
                year: '1994'
                miles: 159,864
        '400':
          description: 400 - Missing required attribute
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 'Request body missing required attribute: vin'
        '409':
          description: 409 - Vehicle already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: >-
                  Vehicle with VIN JN8AZ2KR1AT169594 already exists. Existing
                  vehicle ID: 2
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickName:
                  type: string
                vin:
                  type: string
                make:
                  type: string
                model:
                  type: string
                year:
                  type: string
                miles:
                  type: integer
            example:
              nickName: The Lisa Marie
              vin: 4M2DV11W4RDJ53329
              make: Mercury
              model: Villager
              year: '1994'
              miles: 159864
  /vehicles/{id}:
    get:
      summary: Retrieve a vehicle
      responses:
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nickName:
                    type: string
                  vin:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  year:
                    type: string
                  miles:
                    type: integer
              example:
                id: 1
                nickName: The Lisa Marie
                vin: 4M2DV11W4RDJ53329
                make: Mercury
                model: Villager
                year: '1994'
                miles: 159864
        '404':
          description: 404 - Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: 'Vehicle with id: 0 not found.'
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    patch:
      summary: Update a collection
      responses:
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nickName:
                    type: string
                  vin:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  year:
                    type: string
                  miles:
                    type: integer
              example:
                id: 1
                nickName: The Lisa Marie
                vin: 4M2DV11W4RDJ53329
                make: Mercury
                model: Villager
                year: '1994'
                miles: 159999
        '400':
          description: 400 - Bad request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Bad request body.
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickName:
                  type: string
                vin:
                  type: string
                make:
                  type: string
                model:
                  type: string
                year:
                  type: string
                miles:
                  type: integer
            example:
              nickName: The Lisa Marie
              vin: 4M2DV11W4RDJ53329
              make: Mercury
              model: Villager
              year: '1994'
              miles: 159999
    delete:
      summary: Delete a vehicle
      responses:
        '204':
          description: 204 - Success
        '500':
          description: 500 - Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: An unexpected error occurred.
